name: Deploy mirabolante-web to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'server.js'
      - 'deploy-package.json'
      - '.github/workflows/azure-appservice-mirabolante.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Stage deploy package
        run: |
          rm -rf deploy
          mkdir -p deploy
          cp -a dist/mirabolante/browser deploy/browser
          cp server.js deploy/server.js
          cp deploy-package.json deploy/package.json

      - name: Create clean zip (forward-slash entries, no ./)
        run: cd deploy && zip -r -q ../app.zip browser server.js package.json

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: mirabolante-web
          package: app.zip
